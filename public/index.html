<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Party: Take Two</title>
<meta name="description" content="The party's getting rescheduled. Pick every Saturday you could make it.">
<meta name="theme-color" content="#2a1b3d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Space+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #3a1d45; --bg2: #1d1a38; --ink: #1a1633; --text: #f6efe4; --muted: #b8a9de;
    --yellow: #ffd23f; --yellow-dark: #b8901a; --pink: #ff5fa2; --line: #4a3f7a;
    --field: #221a45;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg2); }
  body {
    margin: 0; min-height: 100vh; color: var(--text);
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    background: radial-gradient(120% 60% at 0% 0%, var(--bg1), var(--bg2) 70%) fixed, var(--bg2);
  }
  main { max-width: 560px; margin: 0 auto; padding: 40px 20px 64px; }
  .eyebrow { font-family: "Space Mono", monospace; color: var(--yellow); letter-spacing: .25em; font-size: 14px; display: flex; align-items: center; gap: 10px; }
  .eyebrow::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--pink); box-shadow: 0 0 12px var(--pink); }
  h1 { font-family: "Bagel Fat One", system-ui; font-weight: 400; margin: 18px 0 14px; line-height: .95; }
  h1 .old { display: inline-block; position: relative; color: var(--muted); font-size: clamp(40px, 12vw, 58px); }
  h1 .old::after { content: ""; position: absolute; left: -6px; right: -6px; top: 52%; height: 7px; background: var(--pink); border-radius: 4px; transform: rotate(-2deg); }
  h1 .new { display: block; color: var(--yellow); font-size: clamp(54px, 16vw, 78px); transform: rotate(-2deg); transform-origin: left; }
  .lede { color: var(--muted); font-size: 18px; line-height: 1.5; margin: 0 0 36px; }
  label.cap { display: block; font-family: "Space Mono", monospace; letter-spacing: .15em; font-size: 13px; color: var(--muted); margin-bottom: 10px; }
  input[type=text] {
    width: 100%; font: 600 20px "Bricolage Grotesque", sans-serif; color: var(--text);
    background: var(--field); border: 2px solid var(--line); border-radius: 16px; padding: 16px 20px; outline: none;
  }
  input[type=text]:focus { border-color: var(--yellow); }
  input::placeholder { color: #8c83ad; }
  .hint { min-height: 22px; font-size: 14px; color: var(--yellow); margin: 8px 2px 18px; }

  .tickets { display: grid; gap: 16px; }
  .ticket {
    --c: #9e3a73; position: relative; display: flex; align-items: center; width: 100%; text-align: left;
    background: var(--c); color: var(--ink); border: 0; border-radius: 22px; padding: 0; cursor: pointer;
    font: inherit; transition: transform .15s ease, filter .15s ease;
    -webkit-mask: radial-gradient(circle 14px at calc(100% - 92px) 0, #0000 98%, #000) top/100% 51% no-repeat,
                  radial-gradient(circle 14px at calc(100% - 92px) 100%, #0000 98%, #000) bottom/100% 51% no-repeat;
            mask: radial-gradient(circle 14px at calc(100% - 92px) 0, #0000 98%, #000) top/100% 51% no-repeat,
                  radial-gradient(circle 14px at calc(100% - 92px) 100%, #0000 98%, #000) bottom/100% 51% no-repeat;
  }
  .ticket:active { transform: scale(.98); }
  .ticket .main { flex: 1; padding: 22px 26px; }
  .ticket .admit { font-family: "Space Mono", monospace; letter-spacing: .2em; font-size: 13px; opacity: .75; }
  .ticket .date { font-family: "Bagel Fat One", system-ui; font-size: 40px; line-height: 1.1; margin-top: 4px; }
  .ticket .dow { font-weight: 700; font-size: 17px; }
  .ticket .stub { width: 92px; align-self: stretch; display: grid; place-items: center; border-left: 2px dashed rgba(26,22,51,.45); }
  .ticket .check { width: 46px; height: 46px; border-radius: 50%; border: 3px solid var(--ink); display: grid; place-items: center; transition: background .15s; }
  .ticket .check svg { width: 24px; height: 24px; opacity: 0; transform: scale(.4); transition: all .18s ease; }
  .ticket[aria-pressed=true] { filter: brightness(1.18) saturate(1.1); }
  .ticket[aria-pressed=true] .check { background: var(--ink); }
  .ticket[aria-pressed=true] .check svg { opacity: 1; transform: scale(1); }
  .ticket .stamp { position: absolute; right: 108px; top: 14px; font-family: "Space Mono", monospace; font-size: 11px; letter-spacing: .15em; padding: 3px 7px; border: 2px solid var(--ink); border-radius: 6px; transform: rotate(6deg); opacity: 0; transition: opacity .15s; }
  .ticket[aria-pressed=true] .stamp { opacity: .8; }

  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 28px; margin: 32px 0 8px; }
  .btn {
    font: 700 20px "Bricolage Grotesque", sans-serif; color: var(--ink); background: var(--yellow);
    border: 0; border-radius: 999px; padding: 18px 34px; cursor: pointer; box-shadow: 0 6px 0 var(--yellow-dark);
    transition: transform .1s, box-shadow .1s;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--yellow-dark); }
  .btn:disabled { opacity: .55; cursor: wait; }
  .link { background: none; border: 0; color: var(--muted); font: 600 18px "Bricolage Grotesque", sans-serif; text-decoration: underline; text-underline-offset: 4px; cursor: pointer; padding: 6px 0; }
  .link[aria-pressed=true] { color: var(--pink); }
  .status { min-height: 24px; font-size: 15px; margin-top: 10px; }
  .status.ok { color: #7ee2b8; } .status.err { color: var(--pink); }

  hr { border: 0; border-top: 3px dashed var(--line); margin: 44px 0 32px; }
  .tally-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  h2 { font-family: "Bagel Fat One", system-ui; font-weight: 400; font-size: 40px; margin: 0; }
  .count { font-family: "Space Mono", monospace; color: var(--muted); font-size: 14px; }
  .empty { color: var(--muted); font-size: 17px; margin-top: 16px; }
  .bars { display: grid; gap: 18px; margin-top: 22px; }
  .bar-row .top { display: flex; justify-content: space-between; font-weight: 700; font-size: 17px; }
  .bar-row .lead { font-family: "Space Mono", monospace; font-size: 11px; letter-spacing: .12em; color: var(--ink); background: var(--yellow); padding: 2px 6px; border-radius: 4px; margin-left: 8px; vertical-align: 2px; }
  .track { height: 14px; border-radius: 999px; background: rgba(255,255,255,.08); margin: 8px 0 6px; overflow: hidden; }
  .fill { height: 100%; border-radius: 999px; background: var(--c); transition: width .4s ease; }
  .who { font-size: 14px; color: var(--muted); }
  .nope { margin-top: 22px; font-size: 15px; color: var(--muted); }
  .nope b { color: var(--pink); }
  footer { margin-top: 40px; font-size: 13px; color: #7d74a3; font-family: "Space Mono", monospace; }
</style>
</head>
<body>
<main>
  <div class="eyebrow">PARTY · TAKE TWO</div>
  <h1><span class="old">Old date</span><span class="new">New date!</span></h1>
  <p class="lede">The party's getting rescheduled. Tap every Saturday you could make it, then hit save. Come back anytime and type the same name to change your picks.</p>

  <label class="cap" for="name">YOUR NAME</label>
  <input id="name" type="text" placeholder="So we know who's in" autocomplete="given-name" maxlength="40">
  <div class="hint" id="hint"></div>

  <div class="tickets" id="tickets"></div>

  <div class="actions">
    <button class="btn" id="save">Save my picks</button>
    <button class="link" id="none" aria-pressed="false">None of these work</button>
  </div>
  <div class="status" id="status" role="status"></div>

  <hr>
  <div class="tally-head"><h2>The tally</h2><span class="count" id="count">0 responses</span></div>
  <div id="tally"></div>
  <footer>Refreshes every 30 seconds.</footer>
</main>

<script>
  // Edit this list to change the date options. Labels are shown as-is.
  const DATES = [
    { id: "2026-11-14", label: "Nov 14", dow: "Saturday", color: "#a23a76" },
    { id: "2026-12-05", label: "Dec 5",  dow: "Saturday", color: "#957d38" },
    { id: "2026-12-12", label: "Dec 12", dow: "Saturday", color: "#2c897a" },
    { id: "2026-12-19", label: "Dec 19", dow: "Saturday", color: "#6c58a8" },
  ];

  const $ = (id) => document.getElementById(id);
  const picked = new Set();
  let none = false;
  let responses = [];
  let loadedFor = "";

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };

  const checkSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="#ffd23f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

  function renderTickets() {
    $("tickets").innerHTML = DATES.map(d => `
      <button class="ticket" style="--c:${d.color}" data-id="${d.id}" aria-pressed="${picked.has(d.id)}">
        <span class="main">
          <span class="admit">ADMIT ONE</span>
          <div class="date">${d.label}</div>
          <div class="dow">${d.dow}</div>
        </span>
        <span class="stamp">I'M IN</span>
        <span class="stub"><span class="check">${checkSvg}</span></span>
      </button>`).join("");
    $("none").setAttribute("aria-pressed", none);
  }

  $("tickets").addEventListener("click", (e) => {
    const t = e.target.closest(".ticket");
    if (!t) return;
    const id = t.dataset.id;
    picked.has(id) ? picked.delete(id) : picked.add(id);
    if (picked.size) none = false;
    renderTickets();
    setStatus("");
  });

  $("none").addEventListener("click", () => {
    none = !none;
    if (none) picked.clear();
    renderTickets();
    setStatus("");
  });

  function setStatus(msg, kind) {
    const s = $("status");
    s.textContent = msg;
    s.className = "status" + (kind ? " " + kind : "");
  }

  function findMine(name) {
    const key = name.trim().toLowerCase();
    return key ? responses.find(r => r.name.trim().toLowerCase() === key) : null;
  }

  // When the typed name matches an existing response, load those picks so they can edit them.
  function syncFromName(force) {
    const name = $("name").value;
    const mine = findMine(name);
    const key = name.trim().toLowerCase();
    if (mine && (force || loadedFor !== key)) {
      picked.clear();
      mine.dates.forEach(d => picked.add(d));
      none = !!mine.none;
      loadedFor = key;
      renderTickets();
      $("hint").textContent = `Welcome back, ${mine.name}! Your saved picks are loaded. Change them and save again.`;
    } else if (!mine) {
      loadedFor = "";
      $("hint").textContent = "";
    }
  }
  $("name").addEventListener("input", () => syncFromName(false));

  $("save").addEventListener("click", async () => {
    const name = $("name").value.trim();
    if (!name) { setStatus("Add your name first.", "err"); $("name").focus(); return; }
    if (!picked.size && !none) { setStatus("Tap at least one date, or 'None of these work'.", "err"); return; }
    $("save").disabled = true;
    setStatus("Saving…");
    try {
      const r = await fetch("/api/responses", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, dates: DATES.map(d => d.id).filter(id => picked.has(id)), none }),
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || "Couldn't save");
      store.set("partyPollName", name);
      loadedFor = name.toLowerCase();
      setStatus("Saved! You can come back and change it anytime.", "ok");
      await loadResponses();
    } catch (err) {
      setStatus(err.message || "Couldn't save. Try again.", "err");
    } finally {
      $("save").disabled = false;
    }
  });

  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }

  function renderTally() {
    const n = responses.length;
    $("count").textContent = `${n} response${n === 1 ? "" : "s"}`;
    if (!n) { $("tally").innerHTML = '<p class="empty">No votes yet. Be the first to RSVP to the future.</p>'; return; }
    const counts = DATES.map(d => ({ ...d, names: responses.filter(r => r.dates.includes(d.id)).map(r => r.name) }));
    const max = Math.max(...counts.map(c => c.names.length));
    const nopes = responses.filter(r => r.none).map(r => r.name);
    $("tally").innerHTML = '<div class="bars">' + counts.map(c => `
      <div class="bar-row" style="--c:${c.color}">
        <div class="top"><span>${c.label} · ${c.dow}${max > 0 && c.names.length === max ? '<span class="lead">LEADING</span>' : ""}</span><span>${c.names.length}/${n}</span></div>
        <div class="track"><div class="fill" style="width:${(c.names.length / n) * 100}%"></div></div>
        <div class="who">${c.names.length ? c.names.map(esc).join(", ") : "Nobody yet"}</div>
      </div>`).join("") + "</div>" +
      (nopes.length ? `<p class="nope"><b>Can't make any:</b> ${nopes.map(esc).join(", ")}</p>` : "");
  }

  async function loadResponses() {
    try {
      const r = await fetch("/api/responses", { cache: "no-store" });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error);
      responses = data.responses || [];
      renderTally();
      syncFromName(false);
    } catch (err) {
      $("tally").innerHTML = `<p class="empty">Couldn't load the tally right now.</p>`;
    }
  }

  const remembered = store.get("partyPollName");
  if (remembered) $("name").value = remembered;
  renderTickets();
  loadResponses();
  setInterval(loadResponses, 30000);
</script>
</body>
</html>
